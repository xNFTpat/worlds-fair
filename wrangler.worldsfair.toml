name = "lp-terminal-worldsfair"
main = "src/worldsfair.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
binding = "ASSETS"
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "RANGE_ALERTS"
class_name = "RangeInbox"
[[durable_objects.bindings]]
name = "BACKGROUND_SCANNER"
class_name = "BackgroundScanner"
[[migrations]]
tag = "worldsfair-v1"
new_sqlite_classes = ["RangeInbox", "BackgroundScanner"]

[vars]
MIN_TVL_USD = "5000"
ROBINHOOD_CHAIN_ID = "4663"
WALLETS = ""
# Explicit mainnet provider selection after PublicNode's intermittent read limits.
# https://www.onfinality.io/en/networks/solana publishes 5 requests/sec. Still's
# private shared budget allows at most 2 JSON-RPC methods/sec, including proof.
# A 429 remains a cooldown; no provider rotation or signing is performed.
SOLANA_RPC = "https://solana.api.onfinality.io/public"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[kv_namespaces]]
binding = "LP_CACHE"
id = "1ed8d4f36c51431c89e04cb97c178ca1"
